name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
      - "test/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-node:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run runtime dependency audit
        run: npm audit --omit=dev

      - name: Run build
        run: npm run build

  verify-native-mac:
    name: Native macOS build
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and test Swift package
        working-directory: native-mac/CarusoRebornMac
        run: swift test
